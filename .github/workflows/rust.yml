name: Manual Release & Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - bugfix

env:
  BINARY_NAME: aborg

permissions:
  contents: write

jobs:
  create-release:
    name: Bump Version & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version in Cargo.toml and Cargo.lock
        id: bump_version
        run: |
          set -e
          # Extract current version
          current_version=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          IFS='.' read -r major minor patch <<< "$current_version"

          case "${{ github.event.inputs.bump }}" in
            major)
              major=$((major + 1))
              ;;
            minor)
              minor=$((minor + 1))
              ;;
            bugfix)
              patch=$((patch + 1))
              ;;
          esac

          new_version="${major}.${minor}.${patch}"

          # Update Cargo.toml
          sed -i "0,/^version = .*/s//version = \"$new_version\"/" Cargo.toml

          # Update Cargo.lock
          if [ -f Cargo.lock ]; then
            sed -i "0,/^version = .*/s//version = \"$new_version\"/" Cargo.lock
          fi

          echo "new_version=$new_version" >> $GITHUB_OUTPUT

          # Optional: Print to verify
          grep "^version =" Cargo.toml | head -n 1

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }}"
          git tag v${{ steps.bump_version.outputs.new_version }}
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Release v${{ steps.bump_version.outputs.new_version }}
          draft: false
          prerelease: false

  build:
    name: Build on ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.new_version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release

      - name: Rename Artifact (Linux)
        if: runner.os == 'Linux'
        run: mv target/release/${{ env.BINARY_NAME }} target/release/${{ env.BINARY_NAME }}-linux

      - name: Rename Artifact (macOS Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: mv target/release/${{ env.BINARY_NAME }} target/release/${{ env.BINARY_NAME }}-macos-arm64

      - name: Rename Artifact (macOS Intel)
        if: matrix.os == 'macos-13'
        run: mv target/release/${{ env.BINARY_NAME }} target/release/${{ env.BINARY_NAME }}-macos-intel

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.new_version }}
          files: target/release/${{ env.BINARY_NAME }}-*
