name: Manual Release & Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - bugfix

env:
  BINARY_NAME: aborg

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Open Version Bump PR
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      branch: ${{ steps.bump_version.outputs.branch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version in Cargo.toml
        id: bump_version
        run: |
          set -e
          current_version=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          IFS='.' read -r major minor patch <<< "$current_version"

          case "${{ github.event.inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            bugfix)
              patch=$((patch + 1))
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          branch="release/v${new_version}"

          sed -i "0,/^version = .*/s//version = \"$new_version\"/" Cargo.toml

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          grep "^version =" Cargo.toml | head -n 1

      - name: Push bump branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.bump_version.outputs.branch }}"
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }}"
          git push origin "${{ steps.bump_version.outputs.branch }}"

      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.bump_version.outputs.branch }}" \
            --title "chore: bump version to ${{ steps.bump_version.outputs.new_version }}" \
            --body "Automated version bump for release v${{ steps.bump_version.outputs.new_version }}. This PR is merged automatically once the release build passes."

  build:
    name: Build on ${{ matrix.os }}
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.branch }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release

      - name: Rename Artifact (Linux)
        if: runner.os == 'Linux'
        run: mv target/release/${{ env.BINARY_NAME }} target/release/${{ env.BINARY_NAME }}-linux

      - name: Rename Artifact (macOS Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: mv target/release/${{ env.BINARY_NAME }} target/release/${{ env.BINARY_NAME }}-macos-arm64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: target/release/${{ env.BINARY_NAME }}-*

  merge-and-release:
    name: Merge PR & Create Release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge version bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ needs.bump-version.outputs.branch }}" --merge --delete-branch

      - name: Tag release
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git tag "v${{ needs.bump-version.outputs.new_version }}"
          git push origin "v${{ needs.bump-version.outputs.new_version }}"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          name: Release v${{ needs.bump-version.outputs.new_version }}
          draft: false
          prerelease: false
          files: artifacts/*

  cleanup-on-failure:
    name: Close PR on Build Failure
    needs: [bump-version, build]
    if: ${{ failure() && needs.bump-version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "${{ needs.bump-version.outputs.branch }}" \
            --repo "${{ github.repository }}" \
            --delete-branch \
            --comment "Build failed, so this automated version bump was not merged. No tag or release was created."
